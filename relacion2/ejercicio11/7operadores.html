<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas del alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <h2 class="text-center mb-4">Calcular nota final</h2>

                <form action="7operadores_resultado.php" method="post">

                    <div class="mb-3">
                        <label for="nota1" class="form-label">Primera nota</label>
                        <input type="number" class="form-control" id="nota1" name="nota1"
                            min="0" max="10" step="0.1" required>
                        <div class="form-text">Introduce una nota entre 0 y 10.</div>
                    </div>

                    <div class="mb-3">
                        <label for="nota2" class="form-label">Segunda nota</label>
                        <input type="number" class="form-control" id="nota2" name="nota2"
                            min="0" max="10" step="0.1" required>
                        <div class="form-text">Introduce una nota entre 0 y 10.</div>
                    </div>

                    <div class="mb-3">
                        <label for="faltas" class="form-label">Número de faltas</label>
                        <input type="number" class="form-control" id="faltas" name="faltas"
                            min="0" step="1" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Calcular nota
                    </button>

                </form>

            </div>
        </div>
    </div>

</body>
</html>
