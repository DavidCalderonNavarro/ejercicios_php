<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <!-- Como se monta un grid para distribuir el espacio -->
     <!-- 1º un div de la class container -->
    <div id="main" class="container" class="bg-secondary-subtle">
        <h2 class="text-primary text-center">Formulario de referencia</h2>
        <!-- 2º un div de class row -->
        <div class="row">
            <!-- 3º varios div para columnas, indicando reparto de las 12 areas de columnas-->
            <div class="col-md-3 col-sm-1 clo-0">
                <!-- Aqui va un espacio en blanco a la izquierda -->
            </div>
            <div class="col-md-6 col-sm-10 clo-12">
                <!-- Aqui va el formulario -->
                <form class="m5-5 border rounded p-3 shadow">
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label fw-bold">Usuario: </label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">es obligatorio introducir este dato</div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label fw-bold">Contraseña: </label>
                        <input type="password" class="form-control" id="exampleInputPassword1">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Check me out</label>
                    </div>
                    <button type="submit" class="btn btn-primary ">Enviar</button>
                </form>
            </div>
            <div class="col-md-3 col-sm-1 clo-0">
                <!-- Aqui va un espacio en blanco a la izquierda -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>

</html>
